defaults:
  - dataset: sms_spam
  - model: naive_bayes
  - feature_extractor: tfidf_default
  - _self_ # Allows this file to also set values

experiment:
  name: "spam_classification_experiment"
  random_seed: 1337 # For reproducibility

hydra:
  run:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
