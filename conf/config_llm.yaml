defaults:
  - dataset: sms_spam
  - model: gpt2_classifier
  - _self_

experiment:
  name: "transformer_spam_classification"
  random_seed: 1337 # For reproducibility

# Early stopping configuration for transformers
early_stopping_patience: 5 # Shorter patience for fine-tuning

hydra:
  run:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
