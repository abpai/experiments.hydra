# @package feature_extractor

_target_: sklearn.feature_extraction.text.TfidfVectorizer

# Advanced TF-IDF configuration with better preprocessing
min_df: 2 # Ignore terms that appear in less than 2 documents
max_df: 0.95 # Ignore terms that appear in more than 95% of documents
ngram_range: ${as_tuple:1,2} # Use unigrams and bigrams
max_features: 10000 # Limit vocabulary to top 10,000 features
stop_words: "english" # Remove English stop words
lowercase: true # Convert to lowercase
strip_accents: "unicode" # Remove accents
