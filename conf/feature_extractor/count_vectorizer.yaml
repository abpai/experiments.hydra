# @package feature_extractor

_target_: sklearn.feature_extraction.text.CountVectorizer

# Count-based feature extraction (alternative to TF-IDF)
min_df: 1 # Minimum document frequency
max_df: 1.0 # Maximum document frequency
ngram_range: ${as_tuple:1,1} # Use only unigrams
max_features: 5000 # Limit vocabulary size
stop_words: "english" # Remove English stop words
lowercase: true # Convert to lowercase
binary: false # Use term frequencies (not just binary occurrence)
