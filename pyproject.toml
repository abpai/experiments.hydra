[project]
name = "experiments.hydra"
version = "0.0.1"
description = "Experiments with Hydra"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.12",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "torch>=2.0.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "structlog>=25.3.0",
    "uvicorn>=0.34.2",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "numpy>=2.2.5",
    "transformers>=4.51.3",
    "sentence-transformers>=4.1.0",
    "tqdm>=4.67.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
markers = ["smoke: quick training smoke tests"]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "ipykernel>=6.29.5",
    "nest-asyncio>=1.6.0",
    "black>=23.3.0",
    "ruff>=0.11.10",
]
